[general]
live_config_reload = true
ipc_socket = true
import = [
    "~/.config/alacritty/themes/noctalia.toml",
    "~/.config/alacritty/themes/noctalia-contrast.toml"
]

[font]
size = 12.0

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 400

[window]
padding = { x = 15, y = 20 }

[font.normal]
family = "CaskaydiaMono Nerd Font"
